name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build and validate Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    env:
      HOME: /github/home
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Prepare Android export environment
        run: |
          set -eu
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$TEMPLATE_DIR" "$HOME/.config/godot"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          keytool -genkeypair -noprompt -keyalg RSA -keysize 2048 -validity 9999 -alias androiddebugkey -keystore "$HOME/debug.keystore" -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          EOF
      - name: Validate Godot project and scripts
        run: |
          godot --version
          godot --headless --editor --path . --quit > /tmp/godot-editor.log 2>&1
          cat /tmp/godot-editor.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-editor.log; then exit 1; fi
          godot --headless --path . --quit-after 2 > /tmp/godot-run.log 2>&1
          cat /tmp/godot-run.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|Invalid get index|Node not found' /tmp/godot-run.log; then exit 1; fi
      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/DeadZoneSurvival.apk
      - name: Validate APK archive
        run: |
          test -s build/DeadZoneSurvival.apk
          unzip -t build/DeadZoneSurvival.apk
          if command -v aapt >/dev/null 2>&1; then aapt dump badging build/DeadZoneSurvival.apk; fi
      - name: Upload APK only after successful validation
        uses: actions/upload-artifact@v4
        with:
          name: DeadZoneSurvival-APK
          path: build/DeadZoneSurvival.apk
          if-no-files-found: error
          retention-days: 14
